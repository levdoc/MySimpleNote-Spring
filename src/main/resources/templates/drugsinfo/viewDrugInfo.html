<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Информация о препарате</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <br>
        <form th:object="${drugInfo}">
            <h5><p class="text-center" th:text="${drugInfo.getNameMnn} + ' (' + ${drugInfo.getNameForm} + ')'"></h5>
            <div class="form-group">
                <div class="mt-3 row g-2">
                    <h3 th:text="МНН + ': ' + ${drugInfo.getName}"></h3>

                    <div class="accordion accordion-flush" id="accordionFlushExample">
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                        data-bs-target="#flush-collapseOne" aria-expanded="false"
                                        aria-controls="flush-collapseOne">
                                    Информация о способах применения и дозах
                                </button>
                            </h2>
                            <div id="flush-collapseOne" class="accordion-collapse collapse"
                                 data-bs-parent="#accordionFlushExample">
                                <div class="accordion-body" th:utext="${drugInfo.getDescription}"></div>
                            </div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                        data-bs-target="#flush-collapseTwo" aria-expanded="false"
                                        aria-controls="flush-collapseTwo">
                                    Ограничения и противопоказания
                                </button>
                            </h2>
                            <div id="flush-collapseTwo" class="accordion-collapse collapse"
                                 data-bs-parent="#accordionFlushExample">
                                <div class="accordion-body" th:utext="${drugInfo.getContraindicationInfo}"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            <br>
            <br>
            <div class="mt-3 row g-2">
                <button class="btn btn-secondary btn-sm" onclick="window.history.back()" type="button">Назад</button>
            </div>
        </form>

    </div>
</div>

</body>

</html>
